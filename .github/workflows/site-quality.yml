name: Site quality

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-static-site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application and release-critical integrations
        run: |
          npm test
          npm run email:check
          npm run release:check

      - name: Validate pages, links, assets, placeholders, and headers
        run: python3 scripts/validate_site.py

      - name: Verify discovery layer is reproducible
        run: |
          node scripts/publish-discovery-layer.mjs
          git diff --exit-code

      - name: Validate Vercel configuration syntax
        run: python3 -m json.tool vercel.json >/dev/null
