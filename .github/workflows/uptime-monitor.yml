name: Endpoint health

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endpoint-health
  cancel-in-progress: true

jobs:
  health:
    name: verify-production-and-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify DNS, HTTPS, canonical routing, and staging protection
        run: python3 scripts/check_endpoints.py
