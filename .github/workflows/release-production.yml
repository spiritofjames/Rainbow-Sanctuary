name: Release production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release (defaults to main)
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: rainbow-production-release
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: verified-production-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out approved release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm test
          npm run email:check
          npm run release:check
          python3 scripts/validate_site.py
          node scripts/publish-discovery-layer.mjs
          git diff --exit-code

      - name: Pull Vercel production configuration
        run: npx vercel@59.0.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build the verified artifact
        run: npx vercel@59.0.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy the verified artifact to production
        run: npx vercel@59.0.0 deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
